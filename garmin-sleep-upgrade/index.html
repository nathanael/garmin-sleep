<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garmin Sleep Love</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Recharts dependencies -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
  
  <!-- Babel for JSX (pinned to a version that defaults to classic runtime; latest uses automatic which emits `import`) -->
  <script src="https://unpkg.com/@babel/standalone@7.17.12/babel.min.js"></script>
  
  <style>
    body { margin: 0; padding: 0; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes sync-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } 50% { box-shadow: 0 0 12px 2px rgba(59, 130, 246, 0.3); } }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, ComposedChart, Bar, BarChart, Legend, ReferenceArea } = window.Recharts;

function GarminSleepAnalyzer() {
  const [sleepData, setSleepData] = useState([]);
  const [dragOver, setDragOver] = useState(false);
  const [garmyLoading, setGarmyLoading] = useState(false);
  const [garmyDays, setGarmyDays] = useState('');
  const [syncing, setSyncing] = useState(false);
  const [syncResult, setSyncResult] = useState(null);
  const [authStatus, setAuthStatus] = useState(null); // null=unknown, true/false
  const [copyToast, setCopyToast] = useState(false);
  const [showLogin, setShowLogin] = useState(false);
  const [loginForm, setLoginForm] = useState({ email: '', password: '', mfa: '' });
  const [loginState, setLoginState] = useState('idle'); // idle, loading, mfa, error
  const [loginError, setLoginError] = useState('');
  const [error, setError] = useState(null);
  const [activeChart, setActiveChart] = useState('score');
  const [savedFiles, setSavedFiles] = useState([]);
  const [currentFileName, setCurrentFileName] = useState('');
  const [uploadExpanded, setUploadExpanded] = useState(true);
  
  const [dateRange, setDateRange] = useState({ start: '', end: '' });
  const [availableDates, setAvailableDates] = useState({ min: '', max: '' });
  const [viewMode, setViewMode] = useState('days');
  
  const [selectStart, setSelectStart] = useState(null);
  const [selectEnd, setSelectEnd] = useState(null);
  const [isSelecting, setIsSelecting] = useState(false);
  const [selectionStats, setSelectionStats] = useState(null);
  
  const [compareMode, setCompareMode] = useState(false);
  const [period1, setPeriod1] = useState({ start: '', end: '' });
  const [period2, setPeriod2] = useState({ start: '', end: '' });
  
  const [showDatePicker, setShowDatePicker] = useState(false);
  const [compareType, setCompareType] = useState('previous');
  const [activePreset, setActivePreset] = useState(null);
  const [editingPeriod, setEditingPeriod] = useState(null);
  const [dragPeriod, setDragPeriod] = useState({ dragging: false, startX: 0, startDate: '', currentDate: '' });
  const [showCopyMenu, setShowCopyMenu] = useState(false);
  const [showRangeMenu, setShowRangeMenu] = useState(false);

  useEffect(() => {
    const saved = localStorage.getItem('garmin_saved_files');
    if (saved) {
      setSavedFiles(JSON.parse(saved));
    }
    fetch('/api/auth/status').then(r => r.json())
      .then(d => {
        setAuthStatus(d.authenticated);
        // Auto-load from DB if server is available
        return fetch('/api/sleep');
      })
      .then(r => r.ok ? r.json() : null)
      .then(records => {
        if (!records || records.length === 0) return;
        const valid = records.filter(d => d.calendarDate && (d.deepSleepSeconds || d.lightSleepSeconds || d.remSleepSeconds));
        const byDate = new Map();
        valid.forEach(r => byDate.set(r.calendarDate, r));
        const deduped = Array.from(byDate.values()).sort((a, b) => new Date(a.calendarDate) - new Date(b.calendarDate));
        setSleepData(deduped);
        const dates = deduped.map(d => d.calendarDate).sort();
        const dateRangeStr = dates.length > 0 ? `${dates[0]} to ${dates[dates.length - 1]}` : '';
        setCurrentFileName(dateRangeStr);
        setLoadInfo({ filesLoaded: 1, fileNames: ['Garmy DB'], uniqueNights: deduped.length, duplicatesRemoved: 0, dateRange: dateRangeStr });
      })
      .catch(() => setAuthStatus(null));
  }, []);

  useEffect(() => {
    if (sleepData.length > 0) {
      const dates = sleepData.map(d => d.calendarDate).sort();
      const minDate = dates[0];
      const maxDate = dates[dates.length - 1];
      setAvailableDates({ min: minDate, max: maxDate });
      
      const end = new Date(maxDate);
      const start = new Date(end);
      start.setDate(start.getDate() - 29);
      const startStr = start.toISOString().split('T')[0];
      const finalStart = startStr < minDate ? minDate : startStr;
      setDateRange({
        start: finalStart,
        end: maxDate
      });
      setActivePreset(finalStart === minDate ? 'all' : '30d');
      
      const endDate = new Date(maxDate);
      const midDate = new Date(endDate);
      midDate.setDate(midDate.getDate() - 14);
      const startDate = new Date(midDate);
      startDate.setDate(startDate.getDate() - 14);
      
      setPeriod2({ start: midDate.toISOString().split('T')[0], end: maxDate });
      setPeriod1({ start: startDate.toISOString().split('T')[0], end: midDate.toISOString().split('T')[0] });
      
      setUploadExpanded(false);
    }
  }, [sleepData]);

  const [loadInfo, setLoadInfo] = useState(null);
  const [mergeMode, setMergeMode] = useState(false);

  const handleLogin = async (e) => {
    e.preventDefault();
    setLoginState('loading');
    setLoginError('');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: loginForm.email, password: loginForm.password }),
      });
      const data = await res.json();
      if (!data.ok) { setLoginState('error'); setLoginError(data.error); return; }
      if (data.mfa_required) { setLoginState('mfa'); return; }
      setAuthStatus(true);
      setShowLogin(false);
      setLoginState('idle');
      setLoginForm({ email: '', password: '', mfa: '' });
    } catch (err) {
      setLoginState('error');
      setLoginError(err.message);
    }
  };

  const handleMfa = async (e) => {
    e.preventDefault();
    setLoginState('loading');
    setLoginError('');
    try {
      const res = await fetch('/api/auth/mfa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: loginForm.mfa }),
      });
      const data = await res.json();
      if (!data.ok) { setLoginState('mfa'); setLoginError(data.error); return; }
      setAuthStatus(true);
      setShowLogin(false);
      setLoginState('idle');
      setLoginForm({ email: '', password: '', mfa: '' });
    } catch (err) {
      setLoginState('mfa');
      setLoginError(err.message);
    }
  };

  const handleLogout = async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    setAuthStatus(false);
  };

  const LoginModal = () => (
    <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50" onClick={() => { setShowLogin(false); setLoginState('idle'); }}>
      <div className="bg-gray-800 rounded-xl p-6 w-full max-w-sm shadow-2xl" onClick={e => e.stopPropagation()}>
        <h2 className="text-lg font-bold text-white mb-4">Garmin Connect Login</h2>
        {loginState === 'mfa' ? (
          <form onSubmit={handleMfa} className="space-y-3">
            <p className="text-sm text-gray-400">Enter the MFA code from your authenticator app.</p>
            <input
              type="text" autoFocus placeholder="MFA Code"
              value={loginForm.mfa}
              onChange={e => setLoginForm(f => ({...f, mfa: e.target.value}))}
              className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500"
            />
            {loginError && <p className="text-red-400 text-xs">{loginError}</p>}
            <button type="submit" disabled={loginState === 'loading'} className="w-full py-2 bg-blue-600 hover:bg-blue-500 disabled:bg-blue-800 text-white rounded-lg text-sm font-medium">
              {loginState === 'loading' ? 'Verifying...' : 'Verify'}
            </button>
          </form>
        ) : (
          <form onSubmit={handleLogin} className="space-y-3">
            <input
              type="email" autoFocus placeholder="Garmin email"
              value={loginForm.email}
              onChange={e => setLoginForm(f => ({...f, email: e.target.value}))}
              className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500"
            />
            <input
              type="password" placeholder="Password"
              value={loginForm.password}
              onChange={e => setLoginForm(f => ({...f, password: e.target.value}))}
              className="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm focus:outline-none focus:border-blue-500"
            />
            {loginError && <p className="text-red-400 text-xs">{loginError}</p>}
            <button type="submit" disabled={loginState === 'loading'} className="w-full py-2 bg-blue-600 hover:bg-blue-500 disabled:bg-blue-800 text-white rounded-lg text-sm font-medium">
              {loginState === 'loading' ? 'Signing in...' : 'Sign In'}
            </button>
          </form>
        )}
      </div>
    </div>
  );

  const loadFromGarmy = async () => {
    setGarmyLoading(true);
    setError(null);
    try {
      const url = garmyDays ? `/api/sleep?days=${garmyDays}` : '/api/sleep';
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Server error: ${res.status}`);
      const records = await res.json();

      const valid = records.filter(d => d.calendarDate && (d.deepSleepSeconds || d.lightSleepSeconds || d.remSleepSeconds));
      const byDate = new Map();
      valid.forEach(r => byDate.set(r.calendarDate, r));
      const deduped = Array.from(byDate.values()).sort((a, b) => new Date(a.calendarDate) - new Date(b.calendarDate));

      setSleepData(deduped);
      const dates = deduped.map(d => d.calendarDate).sort();
      const dateRangeStr = dates.length > 0 ? `${dates[0]} to ${dates[dates.length - 1]}` : 'No data';
      setCurrentFileName(dateRangeStr);
      setLoadInfo({ filesLoaded: 1, fileNames: ['Garmy DB'], uniqueNights: deduped.length, duplicatesRemoved: 0, dateRange: dateRangeStr });
    } catch (err) {
      setError(`Garmy DB: ${err.message}`);
    } finally {
      setGarmyLoading(false);
    }
  };

  const syncFromGarmin = async (days) => {
    setSyncing(true);
    setSyncResult(null);
    try {
      const res = await fetch('/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ days }),
      });
      const data = await res.json();
      setSyncResult(data);
      if (data.ok) {
        await loadFromGarmy();
      }
    } catch (err) {
      setSyncResult({ ok: false, error: err.message });
    } finally {
      setSyncing(false);
    }
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    setError(null);
    
    const files = Array.from(e.dataTransfer.files);
    const jsonFiles = files.filter(f => f.name.endsWith('.json'));
    
    if (jsonFiles.length === 0) {
      setError('Please drop JSON files');
      return;
    }

    Promise.all(jsonFiles.map(file => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            const records = Array.isArray(data) ? data : [data];
            const dates = records.filter(d => d.calendarDate).map(d => d.calendarDate).sort();
            resolve({ 
              fileName: file.name, 
              data: records,
              dateRange: dates.length > 0 ? `${dates[0]} to ${dates[dates.length-1]}` : 'no dates',
              recordCount: records.length,
              validCount: records.filter(d => d.calendarDate && (d.deepSleepSeconds || d.lightSleepSeconds || d.remSleepSeconds || d.sleepScores)).length
            });
          } catch (err) {
            reject(new Error(`Failed to parse ${file.name}`));
          }
        };
        reader.onerror = () => reject(new Error(`Failed to read ${file.name}`));
        reader.readAsText(file);
      });
    }))
    .then(results => {
      const allRawRecords = results.flatMap(r => r.data);
      const newRecords = allRawRecords.filter(d => {
        if (!d.calendarDate) return false;
        const hasSleepData = d.deepSleepSeconds || d.lightSleepSeconds || d.remSleepSeconds || d.sleepScores;
        return hasSleepData;
      });
      
      const allRecords = mergeMode ? [...sleepData, ...newRecords] : newRecords;
      
      const byDate = new Map();
      allRecords.forEach(record => {
        byDate.set(record.calendarDate, record);
      });
      
      const deduped = Array.from(byDate.values()).sort((a, b) => 
        new Date(a.calendarDate) - new Date(b.calendarDate)
      );
      
      setSleepData(deduped);
      
      const dates = deduped.map(d => d.calendarDate).sort();
      const dateRangeStr = dates.length > 0 ? `${dates[0]} to ${dates[dates.length-1]}` : 'No data';
      
      setCurrentFileName(dateRangeStr);
      
      if (deduped.length > 0) {
        autoSaveUpload(deduped, dateRangeStr);
      }
      
      const rejected = allRawRecords.length - newRecords.length;
      
      const fileBreakdown = results.map(r => `${r.fileName.slice(0,20)}...: ${r.validCount}/${r.recordCount} (${r.dateRange})`);
      
      setLoadInfo({
        filesLoaded: jsonFiles.length,
        fileNames: jsonFiles.map(f => f.name),
        totalRecords: allRecords.length,
        uniqueNights: deduped.length,
        duplicatesRemoved: allRecords.length - deduped.length,
        merged: mergeMode,
        rejected: rejected,
        dateRange: dateRangeStr,
        fileBreakdown: fileBreakdown
      });
      
      setMergeMode(false);
    })
    .catch(err => setError(err.message));
  };

  const autoSaveUpload = (data, dateRangeStr) => {
    const saveName = dateRangeStr.replace(/ to /g, '_');
    
    const fileData = {
      name: saveName,
      savedAt: new Date().toISOString(),
      nightCount: data.length,
      dateRange: dateRangeStr
    };
    
    setSavedFiles(prev => {
      const existing = prev.filter(f => f.dateRange !== dateRangeStr);
      const updated = [...existing, fileData];
      
      localStorage.setItem('garmin_saved_files', JSON.stringify(updated));
      localStorage.setItem(`garmin_data_${saveName}`, JSON.stringify(data));
      
      return updated;
    });
  };

  const loadSavedFile = (fileName) => {
    const data = localStorage.getItem(`garmin_data_${fileName}`);
    if (data) {
      const parsed = JSON.parse(data);
      setSleepData(parsed);
      
      const dates = parsed.map(d => d.calendarDate).sort();
      const dateRange = dates.length > 0 ? `${dates[0]} to ${dates[dates.length-1]}` : '';
      
      setCurrentFileName(dateRange);
      setLoadInfo({ filesLoaded: 1, uniqueNights: parsed.length, duplicatesRemoved: 0, dateRange: dateRange });
    }
  };

  const deleteSavedFile = (fileName) => {
    const updated = savedFiles.filter(f => f.name !== fileName);
    localStorage.setItem('garmin_saved_files', JSON.stringify(updated));
    localStorage.removeItem(`garmin_data_${fileName}`);
    setSavedFiles(updated);
  };

  const filteredData = useMemo(() => {
    if (!dateRange.start || !dateRange.end) return sleepData;
    return sleepData.filter(d => d.calendarDate >= dateRange.start && d.calendarDate <= dateRange.end);
  }, [sleepData, dateRange]);

  const calculateStats = (data) => {
    if (data.length === 0) return null;

    const validData = data.filter(d => d.calendarDate);
    
    const getValues = (accessor) => validData.map(accessor).filter(v => v != null && !isNaN(v));
    const avg = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    const min = (arr) => arr.length ? Math.min(...arr) : null;
    const max = (arr) => arr.length ? Math.max(...arr) : null;

    const sleepScores = getValues(d => d.sleepScores?.overallScore);
    const durations = getValues(d => {
      const total = (d.deepSleepSeconds || 0) + (d.lightSleepSeconds || 0) + (d.remSleepSeconds || 0) + (d.awakeSleepSeconds || 0);
      return total > 0 ? total / 3600 : null;
    });
    const remMinutes = getValues(d => d.remSleepSeconds ? d.remSleepSeconds / 60 : null);
    const deepMinutes = getValues(d => d.deepSleepSeconds ? d.deepSleepSeconds / 60 : null);
    const respAvg = getValues(d => d.averageRespiration);
    const respLow = getValues(d => d.lowestRespiration);
    const spo2Avg = getValues(d => d.spo2SleepSummary?.averageSPO2);
    const spo2Low = getValues(d => d.spo2SleepSummary?.lowestSPO2);
    const stress = getValues(d => d.avgSleepStress);
    const hrvOvernight = getValues(d => d.hrvOvernight);
    const bodyBattery = getValues(d => d.bodyBatteryHigh);
    const sleepNeed = getValues(d => d.sleepNeedMinutes ? d.sleepNeedMinutes / 60 : null);

    const sorted = [...validData].sort((a, b) => new Date(a.calendarDate) - new Date(b.calendarDate));

    const timeSeries = sorted.map(d => ({
      date: d.calendarDate,
      shortDate: d.calendarDate.slice(5),
      score: d.sleepScores?.overallScore,
      duration: ((d.deepSleepSeconds || 0) + (d.lightSleepSeconds || 0) + (d.remSleepSeconds || 0)) / 3600,
      rem: d.remSleepSeconds ? d.remSleepSeconds / 60 : null,
      deep: d.deepSleepSeconds ? d.deepSleepSeconds / 60 : null,
      light: d.lightSleepSeconds ? d.lightSleepSeconds / 60 : null,
      respiration: d.averageRespiration,
      respLow: d.lowestRespiration,
      spo2: d.spo2SleepSummary?.averageSPO2,
      spo2Low: d.spo2SleepSummary?.lowestSPO2,
      stress: d.avgSleepStress,
      hrv: d.hrvOvernight,
      restingHr: d.restingHr,
      bodyBattery: d.bodyBatteryHigh,
      sleepNeed: d.sleepNeedMinutes ? d.sleepNeedMinutes / 60 : null
    }));

    const withRolling = timeSeries.map((d, i) => {
      const window = timeSeries.slice(Math.max(0, i - 6), i + 1);
      const remVals = window.map(w => w.rem).filter(v => v != null);
      const deepVals = window.map(w => w.deep).filter(v => v != null);
      const scoreVals = window.map(w => w.score).filter(v => v != null);
      const durationVals = window.map(w => w.duration).filter(v => v != null);
      const respVals = window.map(w => w.respiration).filter(v => v != null);
      const hrvVals = window.map(w => w.hrv).filter(v => v != null);
      const bbVals = window.map(w => w.bodyBattery).filter(v => v != null);
      return {
        ...d,
        remRolling: remVals.length ? remVals.reduce((a,b) => a+b, 0) / remVals.length : null,
        deepRolling: deepVals.length ? deepVals.reduce((a,b) => a+b, 0) / deepVals.length : null,
        scoreRolling: scoreVals.length ? scoreVals.reduce((a,b) => a+b, 0) / scoreVals.length : null,
        durationRolling: durationVals.length ? durationVals.reduce((a,b) => a+b, 0) / durationVals.length : null,
        respRolling: respVals.length ? respVals.reduce((a,b) => a+b, 0) / respVals.length : null,
        hrvRolling: hrvVals.length ? hrvVals.reduce((a,b) => a+b, 0) / hrvVals.length : null,
        bodyBatteryRolling: bbVals.length ? bbVals.reduce((a,b) => a+b, 0) / bbVals.length : null,
      };
    });

    return {
      totalNights: validData.length,
      sleepScore: { avg: avg(sleepScores), min: min(sleepScores), max: max(sleepScores) },
      duration: { avg: avg(durations), min: min(durations), max: max(durations) },
      rem: { avg: avg(remMinutes), min: min(remMinutes), max: max(remMinutes) },
      deep: { avg: avg(deepMinutes), min: min(deepMinutes), max: max(deepMinutes) },
      respiration: { avg: avg(respAvg), lowestAvg: avg(respLow), lowestMin: min(respLow) },
      spo2: { avg: avg(spo2Avg), lowestAvg: avg(spo2Low), lowestMin: min(spo2Low) },
      stress: { avg: avg(stress), min: min(stress), max: max(stress) },
      hrv: { avg: avg(hrvOvernight), min: min(hrvOvernight), max: max(hrvOvernight) },
      bodyBattery: { avg: avg(bodyBattery), min: min(bodyBattery), max: max(bodyBattery) },
      timeSeries: withRolling
    };
  };

  const stats = useMemo(() => calculateStats(filteredData), [filteredData]);

  const aggregatedTimeSeries = useMemo(() => {
    if (!stats?.timeSeries) return [];
    
    if (viewMode === 'days') {
      return [...stats.timeSeries].sort((a, b) => new Date(a.date) - new Date(b.date));
    }
    
    const grouped = new Map();
    
    stats.timeSeries.forEach(day => {
      let key;
      const date = new Date(day.date + 'T00:00:00');
      
      if (viewMode === 'weeks') {
        const monday = new Date(date);
        const dayOfWeek = date.getDay();
        const diff = date.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
        monday.setDate(diff);
        key = monday.toISOString().split('T')[0];
      } else if (viewMode === 'months') {
        key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
      }
      
      if (!grouped.has(key)) {
        grouped.set(key, []);
      }
      grouped.get(key).push(day);
    });
    
    const groupedData = Array.from(grouped.entries()).map(([key, days]) => {
      const avg = (arr, field) => {
        const vals = arr.map(d => d[field]).filter(v => v != null);
        return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      };
      
      return {
        date: key,
        shortDate: viewMode === 'months' ? key : key.slice(5),
        label: viewMode === 'weeks' ? `Week of ${key}` : viewMode === 'months' ? key : key,
        nights: days.length,
        score: avg(days, 'score'),
        duration: avg(days, 'duration'),
        rem: avg(days, 'rem'),
        deep: avg(days, 'deep'),
        light: avg(days, 'light'),
        respiration: avg(days, 'respiration'),
        respLow: avg(days, 'respLow'),
        spo2: avg(days, 'spo2'),
        spo2Low: avg(days, 'spo2Low'),
        stress: avg(days, 'stress'),
        hrv: avg(days, 'hrv'),
        restingHr: avg(days, 'restingHr'),
        bodyBattery: avg(days, 'bodyBattery'),
        sleepNeed: avg(days, 'sleepNeed'),
      };
    });
    
    groupedData.sort((a, b) => {
      const dateA = new Date(a.date.length === 7 ? a.date + '-01' : a.date);
      const dateB = new Date(b.date.length === 7 ? b.date + '-01' : b.date);
      return dateA - dateB;
    });
    
    const windowSize = viewMode === 'days' ? 7 : 3;
    return groupedData.map((d, i) => {
      const window = groupedData.slice(Math.max(0, i - windowSize + 1), i + 1);
      const rollingAvg = (field) => {
        const vals = window.map(w => w[field]).filter(v => v != null);
        return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      };
      return {
        ...d,
        remRolling: rollingAvg('rem'),
        deepRolling: rollingAvg('deep'),
        scoreRolling: rollingAvg('score'),
        durationRolling: rollingAvg('duration'),
        respRolling: rollingAvg('respiration'),
        stressRolling: rollingAvg('stress'),
        spo2Rolling: rollingAvg('spo2'),
        spo2LowRolling: rollingAvg('spo2Low'),
        hrvRolling: rollingAvg('hrv'),
        bodyBatteryRolling: rollingAvg('bodyBattery'),
      };
    });
  }, [stats?.timeSeries, viewMode]);

  const comparisonStats = useMemo(() => {
    if (!compareMode) return null;
    
    const period1Data = sleepData.filter(d => d.calendarDate >= period1.start && d.calendarDate <= period1.end);
    const period2Data = sleepData.filter(d => d.calendarDate >= period2.start && d.calendarDate <= period2.end);
    
    return {
      period1: calculateStats(period1Data),
      period2: calculateStats(period2Data)
    };
  }, [compareMode, sleepData, period1, period2]);

  const priorPeriodStats = useMemo(() => {
    if (!dateRange.start || !dateRange.end || sleepData.length === 0) return null;
    
    const daysDiff = Math.round((new Date(dateRange.end) - new Date(dateRange.start)) / (1000 * 60 * 60 * 24));
    const priorEnd = new Date(dateRange.start);
    priorEnd.setDate(priorEnd.getDate() - 1);
    const priorStart = new Date(priorEnd);
    priorStart.setDate(priorStart.getDate() - daysDiff);
    
    const priorData = sleepData.filter(d => 
      d.calendarDate >= priorStart.toISOString().split('T')[0] && 
      d.calendarDate <= priorEnd.toISOString().split('T')[0]
    );
    
    if (priorData.length === 0) return null;
    
    return calculateStats(priorData);
  }, [dateRange, sleepData]);

  const periodTrend = useMemo(() => {
    const ts = stats?.timeSeries;
    if (!ts || ts.length < 2) return null;
    const n = ts.length;

    const regTrend = (key) => {
      const pts = ts.map((d, i) => [i, d[key]]).filter(p => p[1] != null);
      if (pts.length < 2) return null;
      const pn = pts.length;
      const sumX = pts.reduce((s, p) => s + p[0], 0);
      const sumY = pts.reduce((s, p) => s + p[1], 0);
      const sumXY = pts.reduce((s, p) => s + p[0] * p[1], 0);
      const sumX2 = pts.reduce((s, p) => s + p[0] * p[0], 0);
      const denom = pn * sumX2 - sumX * sumX;
      if (denom === 0) return null;
      const slope = (pn * sumXY - sumX * sumY) / denom;
      const intercept = (sumY - slope * sumX) / pn;
      return { first: intercept, second: intercept + slope * (n - 1) };
    };

    return {
      sleepScore: regTrend('score'),
      duration: regTrend('duration'),
      rem: regTrend('rem'),
      deep: regTrend('deep'),
      respiration: regTrend('respiration'),
      spo2Low: regTrend('spo2Low'),
      stress: regTrend('stress'),
      hrv: regTrend('hrv'),
      bodyBattery: regTrend('bodyBattery'),
    };
  }, [stats?.timeSeries]);

  const hasAvgRespiration = useMemo(() => {
    if (!aggregatedTimeSeries.length) return false;
    const withData = aggregatedTimeSeries.filter(d => d.respiration != null).length;
    return withData / aggregatedTimeSeries.length > 0.5;
  }, [aggregatedTimeSeries]);

  const chartConfigs = {
    score: { title: 'Sleep Score', dataKey: 'score', rollingKey: 'scoreRolling', color: '#10b981', unit: '', refLine: 80, refLabel: 'Good', domain: ['auto', 'auto'] },
    duration: { title: 'Duration', dataKey: 'duration', rollingKey: 'durationRolling', color: '#6ee7b7', unit: 'hrs', refLine: 8, refLabel: '8hr target', domain: ['auto', 'auto'] },
    rem: { title: 'REM Sleep', dataKey: 'rem', rollingKey: 'remRolling', color: '#8b5cf6', unit: 'min', refLine: 90, refLabel: 'Target 90min', domain: ['auto', 'auto'] },
    deep: { title: 'Deep Sleep', dataKey: 'deep', rollingKey: 'deepRolling', color: '#3b82f6', unit: 'min', refLine: 60, refLabel: 'Min 60min', domain: ['auto', 'auto'] },
    respiration: { title: 'Respiration Rate', dataKey: 'respiration', rollingKey: 'respRolling', color: '#f59e0b', unit: 'brpm', refLine: 14, refLabel: 'Normal', domain: ['auto', 'auto'] },
    stress: { title: 'Sleep Stress', dataKey: 'stress', rollingKey: 'stressRolling', color: '#ef4444', unit: '', refLine: 20, refLabel: 'Low', domain: ['auto', 'auto'] },
    spo2: { title: 'SpO2 (Lowest)', dataKey: 'spo2Low', rollingKey: 'spo2LowRolling', color: '#06b6d4', unit: '%', refLine: 92, refLabel: 'Concern <92%', domain: [85, 100] },
    hrv: { title: 'HRV (Overnight)', dataKey: 'hrv', rollingKey: 'hrvRolling', color: '#a78bfa', unit: 'ms', refLine: null, refLabel: null, domain: ['auto', 'auto'] },
    bodyBattery: { title: 'Body Battery', dataKey: 'bodyBattery', rollingKey: 'bodyBatteryRolling', color: '#22c55e', unit: '', refLine: 75, refLabel: 'Good', domain: [0, 100] }
  };

  const currentChart = chartConfigs[activeChart];

  // Linear regression trendline
  const linReg = (data, key) => {
    const pts = data.map((d, i) => [i, d[key]]).filter(p => p[1] != null);
    if (pts.length < 2) return null;
    const n = pts.length;
    const sumX = pts.reduce((s, p) => s + p[0], 0);
    const sumY = pts.reduce((s, p) => s + p[1], 0);
    const sumXY = pts.reduce((s, p) => s + p[0] * p[1], 0);
    const sumX2 = pts.reduce((s, p) => s + p[0] * p[0], 0);
    const denom = n * sumX2 - sumX * sumX;
    if (denom === 0) return null;
    const slope = (n * sumXY - sumX * sumY) / denom;
    const intercept = (sumY - slope * sumX) / n;
    return { slope, intercept };
  };

  const trendData = useMemo(() => {
    if (!aggregatedTimeSeries?.length) return aggregatedTimeSeries;
    const currentKey = chartConfigs[activeChart]?.dataKey;
    if (!currentKey) return aggregatedTimeSeries;
    const reg = linReg(aggregatedTimeSeries, currentKey);
    return aggregatedTimeSeries.map((d, i) => {
      const base = {
        ...d,
        trend: reg ? reg.intercept + reg.slope * i : undefined,
      };
      if (activeChart === 'duration' && d.sleepNeed != null && d.duration != null) {
        const met = d.duration >= d.sleepNeed;
        base.durationMet = met ? d.duration : 0;
        base.durationUnmet = met ? 0 : d.duration;
        base.needGap = met ? 0 : d.sleepNeed - d.duration;
      }
      return base;
    });
  }, [aggregatedTimeSeries, activeChart]);

  const formatNum = (val, decimals = 1) => val != null ? val.toFixed(decimals) : '-';

  const fmtHM = (hours) => {
    if (hours == null || isNaN(hours)) return '-';
    const h = Math.floor(Math.abs(hours));
    const m = Math.round((Math.abs(hours) - h) * 60);
    return `${hours < 0 ? '-' : ''}${h}h ${m}m`;
  };

  const qualify = (metric, value) => {
    if (value == null || isNaN(value)) return { color: '#4b5563', label: '—' };
    const thresholds = {
      score:    [[80, '#10b981', 'GOOD'], [60, '#eab308', 'FAIR'], [0, '#ef4444', 'POOR']],
      duration: [[7.5, '#10b981', 'GOOD'], [6.5, '#eab308', 'FAIR'], [0, '#ef4444', 'LOW']],
      rem:      [[90, '#10b981', 'GOOD'], [60, '#eab308', 'FAIR'], [0, '#ef4444', 'LOW']],
      deep:     [[70, '#10b981', 'GOOD'], [45, '#eab308', 'FAIR'], [0, '#ef4444', 'LOW']],
      hrv:      [[45, '#10b981', 'HIGH'], [30, '#eab308', 'OK'],   [0, '#ef4444', 'LOW']],
      rhr:      [[0, '#10b981', 'GOOD'],  [60, '#eab308', 'OK'],   [70, '#ef4444', 'HIGH']],
      resp:     [[0, '#eab308', 'LOW'],   [12, '#10b981', 'GOOD'], [18, '#eab308', 'HIGH'], [22, '#ef4444', 'HIGH']],
      spo2:     [[95, '#10b981', 'GOOD'], [92, '#eab308', 'FAIR'], [0, '#ef4444', 'LOW']],
    };
    const rules = thresholds[metric];
    if (!rules) return { color: '#4b5563', label: '—' };
    if (metric === 'rhr' || metric === 'resp') {
      let last = rules[0];
      for (const r of rules) if (value >= r[0]) last = r;
      return { color: last[1], label: last[2] };
    }
    for (const [t, color, label] of rules) if (value >= t) return { color, label };
    return { color: '#ef4444', label: 'LOW' };
  };

  const Donut = ({ value, max, color, size = 68, stroke = 8, label, unit, qualifier }) => {
    const pct = value == null || max == null ? 0 : Math.max(0, Math.min(1, value / max));
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const cx = size / 2;
    return (
      <div className="flex flex-col items-center gap-1">
        <div className="relative" style={{ width: size, height: size }}>
          <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
            <circle cx={cx} cy={cx} r={r} fill="none" stroke="#374151" strokeWidth={stroke} />
            <circle cx={cx} cy={cx} r={r} fill="none" stroke={color} strokeWidth={stroke}
              strokeDasharray={`${c * pct} ${c}`} strokeLinecap="round" />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <div className="text-sm font-bold text-white leading-none">{value == null ? '—' : (typeof value === 'number' ? (value >= 100 ? value.toFixed(0) : value.toFixed(value < 10 ? 1 : 0)) : value)}</div>
            {unit && <div className="text-[9px] text-gray-500 leading-none mt-0.5">{unit}</div>}
          </div>
        </div>
        <div className="text-[10px] text-gray-400 uppercase tracking-wide">{label}</div>
        {qualifier && <div className="text-[9px] font-semibold" style={{ color }}>{qualifier}</div>}
      </div>
    );
  };

  const copyForAI = (days) => {
    if (!sleepData.length) return;
    const sorted = [...sleepData].sort((a, b) => new Date(a.calendarDate) - new Date(b.calendarDate));
    const maxDate = sorted[sorted.length - 1].calendarDate;
    let subset = sorted;
    let rangeLabel = 'all time';
    if (days) {
      const cutoff = new Date(maxDate);
      cutoff.setDate(cutoff.getDate() - days + 1);
      const cutoffStr = cutoff.toISOString().split('T')[0];
      subset = sorted.filter(d => d.calendarDate >= cutoffStr);
      const months = Math.round(days / 30);
      rangeLabel = months <= 1 ? 'last month' : months < 12 ? `last ${months} months` : 'last 12 months';
    }
    if (!subset.length) return;

    const nights = subset.map(d => ({
      date: d.calendarDate,
      score: d.sleepScores?.overallScore,
      duration: ((d.deepSleepSeconds || 0) + (d.lightSleepSeconds || 0) + (d.remSleepSeconds || 0)) / 3600,
      awake: (d.awakeSleepSeconds || 0) / 60,
      rem: d.remSleepSeconds ? d.remSleepSeconds / 60 : null,
      deep: d.deepSleepSeconds ? d.deepSleepSeconds / 60 : null,
      light: d.lightSleepSeconds ? d.lightSleepSeconds / 60 : null,
      resp: d.averageRespiration,
      respLow: d.lowestRespiration,
      spo2: d.spo2SleepSummary?.averageSPO2,
      spo2Low: d.spo2SleepSummary?.lowestSPO2,
      stress: d.avgSleepStress,
      hrv: d.hrvOvernight,
      hrvWeekly: d.hrvWeeklyAvg,
      hrvStatus: d.hrvStatus,
      rhr: d.restingHr,
      bb: d.bodyBatteryHigh,
      sleepNeed: d.sleepNeedMinutes,
    }));

    const mean = (arr) => {
      const vals = arr.filter(v => v != null);
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    };
    const num = (v, d = 1) => v == null ? '-' : Number(v).toFixed(d);

    const summary = {
      nights: nights.length,
      score: mean(nights.map(n => n.score)),
      duration: mean(nights.map(n => n.duration)),
      rem: mean(nights.map(n => n.rem)),
      deep: mean(nights.map(n => n.deep)),
      light: mean(nights.map(n => n.light)),
      awake: mean(nights.map(n => n.awake)),
      resp: mean(nights.map(n => n.resp)),
      spo2: mean(nights.map(n => n.spo2)),
      spo2Low: mean(nights.map(n => n.spo2Low)),
      stress: mean(nights.map(n => n.stress)),
      hrv: mean(nights.map(n => n.hrv)),
      rhr: mean(nights.map(n => n.rhr)),
      bb: mean(nights.map(n => n.bb)),
    };

    const header = '| Date | Score | Dur(h) | REM(m) | Deep(m) | Light(m) | Awake(m) | Resp | SpO2 | SpO2 low | Stress | HRV | RHR | BB high |';
    const sep = '|---|---|---|---|---|---|---|---|---|---|---|---|---|---|';
    const rows = nights.map(n => `| ${n.date} | ${num(n.score, 0)} | ${num(n.duration)} | ${num(n.rem, 0)} | ${num(n.deep, 0)} | ${num(n.light, 0)} | ${num(n.awake, 0)} | ${num(n.resp)} | ${num(n.spo2)} | ${num(n.spo2Low, 0)} | ${num(n.stress)} | ${num(n.hrv, 0)} | ${num(n.rhr, 0)} | ${num(n.bb, 0)} |`);

    const firstDate = subset[0].calendarDate;
    const lastDate = subset[subset.length - 1].calendarDate;

    const prompt = [
      `I'm sharing my Garmin sleep data (${rangeLabel}: ${firstDate} to ${lastDate}, ${nights.length} nights).`,
      '',
      'Please analyze trends, flag anything concerning, and suggest what to focus on. Highlight patterns in REM/deep sleep, HRV, respiration, and recovery.',
      '',
      '## Averages',
      `- Sleep score: ${num(summary.score, 0)}`,
      `- Duration: ${num(summary.duration)} h`,
      `- REM: ${num(summary.rem, 0)} min`,
      `- Deep: ${num(summary.deep, 0)} min`,
      `- Light: ${num(summary.light, 0)} min`,
      `- Awake: ${num(summary.awake, 0)} min`,
      `- Avg respiration: ${num(summary.resp)} brpm`,
      `- Avg SpO2: ${num(summary.spo2)}% (lowest avg ${num(summary.spo2Low, 0)}%)`,
      `- Sleep stress: ${num(summary.stress)}`,
      `- HRV overnight: ${num(summary.hrv, 0)} ms`,
      `- Resting HR: ${num(summary.rhr, 0)} bpm`,
      `- Body Battery high: ${num(summary.bb, 0)}`,
      '',
      '## Per-night data',
      header,
      sep,
      ...rows,
    ].join('\n');

    navigator.clipboard.writeText(prompt);
    setCopyToast(true);
    setShowCopyMenu(false);
    setTimeout(() => setCopyToast(false), 2000);
  };

  const formatDiff = (val1, val2, decimals = 1, invert = false) => {
    if (val1 == null || val2 == null) return '-';
    const diff = val2 - val1;
    const sign = diff > 0 ? '+' : '';
    const color = invert
      ? (diff < 0 ? 'text-green-400' : diff > 0 ? 'text-red-400' : 'text-gray-400')
      : (diff > 0 ? 'text-green-400' : diff < 0 ? 'text-red-400' : 'text-gray-400');
    return <span className={color}>{sign}{diff.toFixed(decimals)}</span>;
  };

  // Empty state - full screen drop zone
  if (sleepData.length === 0) {
    return (
      <div
        className="min-h-screen bg-gray-900 text-gray-100"
        onDrop={handleDrop}
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
      >
        {showLogin && <LoginModal />}
        <div className={`min-h-screen flex flex-col items-center justify-center p-8 transition-colors ${
          dragOver ? 'bg-blue-900/30' : ''
        }`}>
          <div className={`w-full max-w-2xl border-2 border-dashed rounded-2xl p-12 text-center transition-all ${
            dragOver ? 'border-blue-400 bg-blue-900/20 scale-105' : 'border-gray-600'
          }`}>
            <div className="text-6xl mb-6">🌙</div>
            <h1 className="text-3xl font-bold mb-2 text-blue-400">Garmin Sleep Analyzer</h1>
            <p className="text-gray-400 mb-8">v1.9.1</p>
            
            <div className="space-y-4">
              <p className="text-xl text-gray-300">
                {dragOver ? 'Drop files here!' : 'Drop your Garmin sleep JSON files anywhere'}
              </p>
              <p className="text-sm text-gray-500">
                Export from <a href="https://www.garmin.com/account/datamanagement/" target="_blank" rel="noopener noreferrer" className="text-blue-400 hover:underline">garmin.com/account/datamanagement</a>
              </p>
              <p className="text-xs text-gray-600">
                Look for files in: DI_CONNECT/DI_CONNECT_FITNESS/
              </p>
              <div className="mt-6 pt-4 border-t border-gray-700">
                <div className="flex items-center justify-center gap-2">
                  <select
                    value={garmyDays}
                    onChange={(e) => setGarmyDays(e.target.value)}
                    className="px-2 py-2 bg-gray-700 text-gray-200 rounded-lg text-sm border border-gray-600"
                  >
                    <option value="">All time</option>
                    <option value="30">30 days</option>
                    <option value="90">90 days</option>
                    <option value="180">6 months</option>
                    <option value="365">1 year</option>
                    <option value="730">2 years</option>
                  </select>
                  <button
                    onClick={loadFromGarmy}
                    disabled={garmyLoading}
                    className="px-4 py-2 bg-green-600 hover:bg-green-500 disabled:bg-green-800 disabled:text-gray-400 text-white rounded-lg text-sm font-medium transition-colors"
                  >
                    {garmyLoading ? 'Loading...' : 'Load from Garmy DB'}
                  </button>
                </div>
                <div className="mt-2 flex items-center justify-center gap-2 text-xs">
                  {authStatus === true && <span className="text-green-400">Connected to Garmin</span>}
                  {authStatus === false && (
                    <button onClick={() => setShowLogin(true)} className="text-yellow-400 hover:text-yellow-300 underline">
                      Sign in to Garmin to sync
                    </button>
                  )}
                  {authStatus === null && <span className="text-gray-500">Requires server.py</span>}
                </div>
                <div className="mt-3 flex items-center justify-center gap-2 text-xs text-gray-400">
                  <span>Sync from Garmin:</span>
                  {[30, 90, 180, 365, 730].map(d => (
                    <button
                      key={d}
                      onClick={() => syncFromGarmin(d)}
                      disabled={syncing}
                      className="px-2 py-1 bg-gray-700 hover:bg-gray-600 disabled:bg-gray-800 disabled:text-gray-500 rounded transition-colors"
                    >
                      {d >= 365 ? `${d/365}yr` : d >= 180 ? `${d/30}mo` : `${d}d`}
                    </button>
                  ))}
                </div>
                {syncing && <p className="text-xs text-yellow-400 mt-2">Syncing from Garmin API...</p>}
                {syncResult && !syncResult.ok && <p className="text-xs text-red-400 mt-2">{syncResult.error}</p>}
                {syncResult?.ok && <p className="text-xs text-green-400 mt-2">{syncResult.output}</p>}
              </div>
            </div>

            {error && (
              <div className="mt-6 p-3 bg-red-900/30 border border-red-500/50 rounded-lg">
                <p className="text-red-400 text-sm">{error}</p>
              </div>
            )}
          </div>

          {/* Saved datasets */}
          {savedFiles.length > 0 && (
            <div className="mt-8 w-full max-w-2xl">
              <div className="bg-gray-800/50 rounded-lg p-4">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-sm text-gray-400">Previously loaded datasets</span>
                  <button 
                    onClick={() => {
                      savedFiles.forEach(f => localStorage.removeItem(`garmin_data_${f.name}`));
                      localStorage.removeItem('garmin_saved_files');
                      setSavedFiles([]);
                    }}
                    className="text-xs text-red-400 hover:text-red-300"
                  >
                    Clear all
                  </button>
                </div>
                <div className="flex flex-wrap gap-2">
                  {savedFiles.map(f => (
                    <div 
                      key={f.name} 
                      className="flex items-center gap-2 text-sm bg-gray-700 hover:bg-gray-600 rounded-lg px-3 py-2 cursor-pointer transition-colors"
                      onClick={() => loadSavedFile(f.name)}
                    >
                      <span>📊</span>
                      <span>{f.dateRange}</span>
                      <span className="text-gray-400">({f.nightCount} nights)</span>
                      <button 
                        onClick={(e) => {
                          e.stopPropagation();
                          deleteSavedFile(f.name);
                        }}
                        className="text-red-400 hover:text-red-300 ml-1"
                      >
                        ×
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gray-900 text-gray-100">
      {showLogin && <LoginModal />}
      <div className="max-w-6xl mx-auto p-4">
        <div className="flex items-center justify-between mb-4">
          <h1 className="text-2xl font-bold text-blue-400">
            Garmin Sleep Analyzer
            <span className="text-xs font-normal text-gray-500 ml-2">v1.9.1</span>
          </h1>
          <div className="flex items-center gap-2 text-xs">
            {authStatus === true && (
              <>
                <button
                  onClick={() => syncFromGarmin(7)}
                  disabled={syncing}
                  className="px-2 py-1 bg-green-600 hover:bg-green-500 disabled:bg-green-800 disabled:text-gray-400 text-white rounded text-xs font-medium transition-colors"
                >
                  {syncing ? 'Syncing...' : 'Sync Latest'}
                </button>
                <span className="text-green-400">Garmin connected</span>
                <button onClick={handleLogout} className="text-gray-500 hover:text-gray-300">logout</button>
              </>
            )}
            {authStatus === false && (
              <button onClick={() => setShowLogin(true)} className="px-2 py-1 bg-yellow-600 hover:bg-yellow-500 text-white rounded text-xs">
                Sign in to Garmin
              </button>
            )}
          </div>
        </div>
        
        {stats && availableDates.min && availableDates.max && (
          <div className="space-y-4">
            {/* Last Night Hero - always the true latest night, unaffected by range controls */}
            {(() => {
              if (!sleepData.length) return null;
              const sorted = [...sleepData].sort((a, b) => new Date(a.calendarDate) - new Date(b.calendarDate));
              const nights = sorted.slice(-14).map(d => ({
                date: d.calendarDate,
                score: d.sleepScores?.overallScore,
                duration: ((d.deepSleepSeconds || 0) + (d.lightSleepSeconds || 0) + (d.remSleepSeconds || 0)) / 3600,
                rem: d.remSleepSeconds ? d.remSleepSeconds / 60 : null,
                deep: d.deepSleepSeconds ? d.deepSleepSeconds / 60 : null,
                hrv: d.hrvOvernight,
                restingHr: d.restingHr,
                respiration: d.averageRespiration,
                spo2: d.spo2SleepSummary?.averageSPO2,
                sleepNeed: d.sleepNeedMinutes ? d.sleepNeedMinutes / 60 : null,
              }));
              const last = nights[nights.length - 1];
              const baselineHrs = last.sleepNeed || nights.map(d => d.sleepNeed).filter(v => v != null).slice(-1)[0] || 7.83;
              const debtHrs = nights.reduce((sum, d) => {
                if (d.duration == null || d.sleepNeed == null) return sum;
                return sum + Math.max(0, d.sleepNeed - d.duration);
              }, 0);
              const scoreQ = qualify('score', last.score);
              return (
                <div className="bg-gray-800 rounded-lg p-4">
                  {/* Top row: hero score + sleep debt */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pb-4 border-b border-gray-700">
                    {/* Whoop-style hero score */}
                    <div className="flex items-center gap-4">
                      <div className="relative" style={{ width: 120, height: 120 }}>
                        <svg width={120} height={120} style={{ transform: 'rotate(-90deg)' }}>
                          <circle cx={60} cy={60} r={52} fill="none" stroke="#374151" strokeWidth={12} />
                          <circle cx={60} cy={60} r={52} fill="none" stroke={scoreQ.color} strokeWidth={12}
                            strokeDasharray={`${2 * Math.PI * 52 * ((last.score || 0) / 100)} ${2 * Math.PI * 52}`}
                            strokeLinecap="round" />
                        </svg>
                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                          <div className="text-3xl font-bold text-white leading-none">{last.score != null ? Math.round(last.score) : '—'}</div>
                          <div className="text-xs text-gray-500 mt-0.5">/ 100</div>
                        </div>
                      </div>
                      <div>
                        <div className="text-xs text-gray-500 uppercase tracking-wide">Last night</div>
                        <div className="text-lg font-bold" style={{ color: scoreQ.color }}>{scoreQ.label}</div>
                        <div className="text-xs text-gray-400 mt-1">{last.date}</div>
                        <div className="text-sm text-gray-300 mt-1">{fmtHM(last.duration)} <span className="text-gray-500">/ {fmtHM(baselineHrs)} need</span></div>
                      </div>
                    </div>
                    {/* RISE-style sleep debt */}
                    <div className="flex flex-col justify-center">
                      <div className="text-xs text-gray-500 uppercase tracking-wide mb-1">Sleep debt (last 14 nights)</div>
                      <div className={`text-3xl font-bold mb-2 ${debtHrs > 5 ? 'text-red-400' : debtHrs > 2 ? 'text-yellow-400' : 'text-green-400'}`}>{fmtHM(debtHrs)}</div>
                      <div className="flex gap-1 h-7">
                        {nights.map((d, i) => {
                          if (d.duration == null || d.sleepNeed == null) {
                            return <div key={i} className="flex-1 rounded-sm bg-gray-700/60" title={`${d.date}: no data`} />;
                          }
                          const ratio = d.duration / d.sleepNeed;
                          const color = ratio >= 1 ? '#10b981' : ratio >= 0.85 ? '#eab308' : '#ef4444';
                          return (
                            <div key={i} className="flex-1 rounded-sm" style={{ backgroundColor: color }}
                              title={`${d.date}: ${fmtHM(d.duration)} / ${fmtHM(d.sleepNeed)}`} />
                          );
                        })}
                      </div>
                      <div className="text-[10px] text-gray-500 mt-1">vs {fmtHM(baselineHrs)} baseline</div>
                    </div>
                  </div>
                  {/* Oura-style contributor rings */}
                  <div className="pt-4">
                    <div className="text-xs text-gray-500 uppercase tracking-wide mb-3">Last night contributors</div>
                    <div className="flex flex-wrap gap-3 justify-around">
                      <Donut value={last.score} max={100} label="Score" qualifier={qualify('score', last.score).label} color={qualify('score', last.score).color} />
                      <Donut value={last.duration} max={9} label="Duration" unit="hrs" qualifier={qualify('duration', last.duration).label} color={qualify('duration', last.duration).color} />
                      <Donut value={last.rem} max={120} label="REM" unit="min" qualifier={qualify('rem', last.rem).label} color={qualify('rem', last.rem).color} />
                      <Donut value={last.deep} max={90} label="Deep" unit="min" qualifier={qualify('deep', last.deep).label} color={qualify('deep', last.deep).color} />
                      <Donut value={last.hrv} max={60} label="HRV" unit="ms" qualifier={qualify('hrv', last.hrv).label} color={qualify('hrv', last.hrv).color} />
                      <Donut value={last.restingHr} max={80} label="RHR" unit="bpm" qualifier={qualify('rhr', last.restingHr).label} color={qualify('rhr', last.restingHr).color} />
                      <Donut value={last.respiration} max={25} label="Resp" unit="brpm" qualifier={qualify('resp', last.respiration).label} color={qualify('resp', last.respiration).color} />
                      <Donut value={last.spo2} max={100} label="SpO2" unit="%" qualifier={qualify('spo2', last.spo2).label} color={qualify('spo2', last.spo2).color} />
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* Unified card: controls header + everything they control */}
            <div className="bg-gray-800 rounded-lg">
              {/* Controls header */}
              <div className="p-3 border-b border-gray-700">
              <div className="flex flex-wrap items-center gap-3">
                {/* Date range stepper + dropdown */}
                {(() => {
                  const fmtDay = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                  const startYear = dateRange.start.slice(0, 4);
                  const endYear = dateRange.end.slice(0, 4);
                  const rangeLabel = startYear === endYear
                    ? `${fmtDay(dateRange.start)} – ${fmtDay(dateRange.end)}, ${endYear}`
                    : `${fmtDay(dateRange.start)}, ${startYear} – ${fmtDay(dateRange.end)}, ${endYear}`;

                  const applyPreset = (days, label) => {
                    const end = new Date(availableDates.max);
                    const start = new Date(end);
                    start.setDate(start.getDate() - days + 1);
                    const startStr = start.toISOString().split('T')[0];
                    setDateRange({ start: startStr, end: availableDates.max });
                    setActivePreset(label);
                    if (compareMode) {
                      const p1End = new Date(start);
                      p1End.setDate(p1End.getDate() - 1);
                      const p1Start = new Date(p1End);
                      p1Start.setDate(p1Start.getDate() - days + 1);
                      setPeriod1({ start: p1Start.toISOString().split('T')[0], end: p1End.toISOString().split('T')[0] });
                      setPeriod2({ start: startStr, end: availableDates.max });
                      setCompareType('previous');
                    }
                    setShowRangeMenu(false);
                  };

                  const applyAll = () => {
                    setDateRange({ start: availableDates.min, end: availableDates.max });
                    setActivePreset('all');
                    if (compareMode) {
                      const totalDays = Math.round((new Date(availableDates.max) - new Date(availableDates.min)) / (1000 * 60 * 60 * 24));
                      const midDate = new Date(availableDates.min);
                      midDate.setDate(midDate.getDate() + Math.floor(totalDays / 2));
                      const midStr = midDate.toISOString().split('T')[0];
                      const midMinus1 = new Date(midDate);
                      midMinus1.setDate(midMinus1.getDate() - 1);
                      setPeriod1({ start: availableDates.min, end: midMinus1.toISOString().split('T')[0] });
                      setPeriod2({ start: midStr, end: availableDates.max });
                      setCompareType('custom');
                    }
                    setShowRangeMenu(false);
                  };

                  const stepPeriod = (dir) => {
                    const daysDiff = Math.round((new Date(dateRange.end) - new Date(dateRange.start)) / (1000 * 60 * 60 * 24)) + 1;
                    let newStart, newEnd;
                    if (dir < 0) {
                      newEnd = new Date(dateRange.start);
                      newEnd.setDate(newEnd.getDate() - 1);
                      newStart = new Date(newEnd);
                      newStart.setDate(newStart.getDate() - daysDiff + 1);
                      if (newStart < new Date(availableDates.min)) return;
                    } else {
                      newStart = new Date(dateRange.end);
                      newStart.setDate(newStart.getDate() + 1);
                      newEnd = new Date(newStart);
                      newEnd.setDate(newEnd.getDate() + daysDiff - 1);
                      if (newEnd > new Date(availableDates.max)) return;
                    }
                    setDateRange({
                      start: newStart.toISOString().split('T')[0],
                      end: newEnd.toISOString().split('T')[0]
                    });
                    setActivePreset(null);
                  };

                  const presets = [
                    { label: '7d', days: 7, name: 'Last 7 days' },
                    { label: '14d', days: 14, name: 'Last 14 days' },
                    { label: '30d', days: 30, name: 'Last 30 days' },
                    { label: '3mo', days: 90, name: 'Last 3 months' },
                    { label: '6mo', days: 180, name: 'Last 6 months' },
                    { label: '1y', days: 365, name: 'Last year' },
                  ];

                  return (
                    <div className="flex items-center">
                      <button
                        onClick={() => stepPeriod(-1)}
                        className="h-8 px-2 flex items-center bg-gray-700 hover:bg-gray-600 rounded-l text-gray-300 text-sm border-r border-gray-800"
                        title="Previous period"
                      >
                        ‹
                      </button>
                      <div className="relative">
                        <button
                          onClick={() => setShowRangeMenu(!showRangeMenu)}
                          className="h-8 flex items-center gap-2 bg-gray-700 hover:bg-gray-600 px-3 text-sm"
                        >
                          <span className="font-medium">{rangeLabel}</span>
                          <span className="text-gray-400 text-xs">{stats.totalNights} nights</span>
                          <span className="text-gray-500 text-[10px]">▾</span>
                        </button>
                        {showRangeMenu && (
                          <div className="absolute left-0 mt-1 w-44 bg-gray-800 border border-gray-700 rounded shadow-lg z-50 py-1">
                            {presets.map(p => (
                              <button
                                key={p.label}
                                onClick={() => applyPreset(p.days, p.label)}
                                className={`w-full flex items-center justify-between px-3 py-1.5 text-xs text-left hover:bg-gray-700 ${
                                  activePreset === p.label ? 'text-blue-400' : 'text-gray-300'
                                }`}
                              >
                                <span>{p.name}</span>
                                {activePreset === p.label && <span>✓</span>}
                              </button>
                            ))}
                            <button
                              onClick={applyAll}
                              className={`w-full flex items-center justify-between px-3 py-1.5 text-xs text-left hover:bg-gray-700 ${
                                activePreset === 'all' ? 'text-blue-400' : 'text-gray-300'
                              }`}
                            >
                              <span>All time</span>
                              {activePreset === 'all' && <span>✓</span>}
                            </button>
                            <div className="border-t border-gray-700 my-1"></div>
                            <button
                              onClick={() => { setShowRangeMenu(false); setShowDatePicker(true); }}
                              className="w-full px-3 py-1.5 text-xs text-left text-gray-300 hover:bg-gray-700"
                            >
                              Custom range…
                            </button>
                          </div>
                        )}
                      </div>
                      <button
                        onClick={() => stepPeriod(1)}
                        className="h-8 px-2 flex items-center bg-gray-700 hover:bg-gray-600 rounded-r text-gray-300 text-sm border-l border-gray-800"
                        title="Next period"
                      >
                        ›
                      </button>
                    </div>
                  );
                })()}

                {/* View Mode Toggle */}
                <div className="flex bg-gray-700 rounded overflow-hidden">
                  {['days', 'weeks', 'months'].map(mode => (
                    <button
                      key={mode}
                      onClick={() => setViewMode(mode)}
                      className={`h-8 px-3 flex items-center text-xs capitalize ${
                        viewMode === mode ? 'bg-blue-600 text-white' : 'text-gray-300 hover:bg-gray-600'
                      }`}
                    >
                      {mode}
                    </button>
                  ))}
                </div>

                {/* Compare Toggle */}
                <button
                  onClick={() => {
                    if (!compareMode) {
                      const daysDiff = Math.round((new Date(dateRange.end) - new Date(dateRange.start)) / (1000 * 60 * 60 * 24));
                      const p1End = new Date(dateRange.start);
                      p1End.setDate(p1End.getDate() - 1);
                      const p1Start = new Date(p1End);
                      p1Start.setDate(p1Start.getDate() - daysDiff);

                      setPeriod1({
                        start: p1Start.toISOString().split('T')[0],
                        end: p1End.toISOString().split('T')[0]
                      });
                      setPeriod2({ start: dateRange.start, end: dateRange.end });
                      setCompareType('previous');
                    }
                    setCompareMode(!compareMode);
                  }}
                  className={`ml-auto h-8 px-3 flex items-center rounded text-xs font-medium transition-colors ${
                    compareMode
                      ? 'bg-purple-600 text-white'
                      : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                  }`}
                >
                  {compareMode ? '✓ Comparing' : 'Compare'}
                </button>

                {/* Copy for AI */}
                <div className="relative">
                  <button
                    onClick={() => setShowCopyMenu(v => !v)}
                    className="h-8 flex items-center gap-1.5 px-3 rounded text-xs font-medium bg-gray-700 text-gray-300 hover:bg-gray-600 transition-colors"
                    title="Copy sleep data + prompt to clipboard for Claude/ChatGPT"
                  >
                    Copy for AI
                    <span className="text-gray-500 text-[10px]">▾</span>
                  </button>
                  {showCopyMenu && (
                    <>
                      <div className="fixed inset-0 z-40" onClick={() => setShowCopyMenu(false)} />
                      <div className="absolute right-0 mt-1 w-40 bg-gray-800 border border-gray-700 rounded shadow-lg z-50 py-1">
                        {[
                          { label: '1 month', days: 30 },
                          { label: '3 months', days: 90 },
                          { label: '6 months', days: 180 },
                          { label: '12 months', days: 365 },
                          { label: 'All time', days: null },
                        ].map(opt => (
                          <button
                            key={opt.label}
                            onClick={() => copyForAI(opt.days)}
                            className="w-full text-left px-3 py-1.5 text-xs text-gray-200 hover:bg-gray-700"
                          >
                            {opt.label}
                          </button>
                        ))}
                      </div>
                    </>
                  )}
                </div>
              </div>

              {/* Compare Options */}
              {compareMode && (
                <div className="mt-2 pt-2 border-t border-gray-700 space-y-3">
                  <div className="flex flex-wrap items-center gap-1.5 text-xs">
                    <span className="text-gray-500">Quick:</span>
                    
                    {[
                      { label: '7d', days: 7 },
                      { label: '30d', days: 30 },
                      { label: '90d', days: 90 },
                      { label: '6mo', days: 182 },
                      { label: '1y', days: 365 },
                    ].map(preset => (
                      <button
                        key={preset.label}
                        onClick={() => {
                          setCompareType(`${preset.days}d`);
                          const end = new Date(availableDates.max);
                          const start = new Date(end);
                          start.setDate(start.getDate() - preset.days + 1);
                          setPeriod2({ start: start.toISOString().split('T')[0], end: availableDates.max });
                          const p1End = new Date(start);
                          p1End.setDate(p1End.getDate() - 1);
                          const p1Start = new Date(p1End);
                          p1Start.setDate(p1Start.getDate() - preset.days + 1);
                          setPeriod1({ start: p1Start.toISOString().split('T')[0], end: p1End.toISOString().split('T')[0] });
                          setDateRange({ start: start.toISOString().split('T')[0], end: availableDates.max });
                          setActivePreset(preset.label);
                        }}
                        className={`px-2 py-1 rounded transition-colors ${
                          compareType === `${preset.days}d` ? 'bg-purple-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                        }`}
                      >
                        {preset.label}
                      </button>
                    ))}
                    
                    <span className="text-gray-700 mx-1">|</span>
                    
                    <span className="text-gray-500">Compare to:</span>
                    <button
                      onClick={() => {
                        setCompareType('previous');
                        const daysDiff = Math.round((new Date(period2.end) - new Date(period2.start)) / (1000 * 60 * 60 * 24));
                        const p1End = new Date(period2.start);
                        p1End.setDate(p1End.getDate() - 1);
                        const p1Start = new Date(p1End);
                        p1Start.setDate(p1Start.getDate() - daysDiff);
                        setPeriod1({ start: p1Start.toISOString().split('T')[0], end: p1End.toISOString().split('T')[0] });
                      }}
                      className={`px-2 py-1 rounded transition-colors ${
                        compareType === 'previous' || compareType.endsWith('d') ? 'bg-purple-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                      }`}
                    >
                      Prior
                    </button>
                    {(() => {
                      const yoyStartDate = new Date(period2.start);
                      yoyStartDate.setFullYear(yoyStartDate.getFullYear() - 1);
                      const yoyEndDate = new Date(period2.end);
                      yoyEndDate.setFullYear(yoyEndDate.getFullYear() - 1);
                      const hasYoyData = yoyStartDate >= new Date(availableDates.min) && yoyEndDate >= new Date(availableDates.min);
                      
                      return (
                        <button
                          onClick={() => {
                            if (!hasYoyData) return;
                            setCompareType('year');
                            setPeriod1({ start: yoyStartDate.toISOString().split('T')[0], end: yoyEndDate.toISOString().split('T')[0] });
                          }}
                          disabled={!hasYoyData}
                          className={`px-2 py-1 rounded transition-colors ${
                            !hasYoyData 
                              ? 'bg-gray-800 text-gray-600 cursor-not-allowed' 
                              : compareType === 'year' 
                                ? 'bg-purple-600 text-white' 
                                : 'bg-gray-700 text-gray-300 hover:bg-gray-600'
                          }`}
                          title={!hasYoyData ? 'Not enough historical data for year-over-year comparison' : 'Compare to same period last year'}
                        >
                          YoY
                        </button>
                      );
                    })()}
                  </div>

                  {/* Timeline with drag-to-select */}
                  <div className="bg-gray-900/50 rounded-lg p-3">
                    <div className="text-xs text-gray-500 mb-2">Drag on timeline to select period • Comparison auto-calculated</div>
                    
                    <div 
                      className="relative h-12 bg-gray-700 rounded cursor-crosshair select-none"
                      onMouseDown={(e) => {
                        const rect = e.currentTarget.getBoundingClientRect();
                        const totalDays = Math.round((new Date(availableDates.max) - new Date(availableDates.min)) / (1000*60*60*24));
                        const dayIndex = Math.round(((e.clientX - rect.left) / rect.width) * totalDays);
                        const d = new Date(availableDates.min);
                        d.setDate(d.getDate() + dayIndex);
                        const date = d.toISOString().split('T')[0];
                        setDragPeriod({ dragging: true, startX: e.clientX, startDate: date, currentDate: date });
                      }}
                      onMouseMove={(e) => {
                        if (dragPeriod.dragging) {
                          const rect = e.currentTarget.getBoundingClientRect();
                          const totalDays = Math.round((new Date(availableDates.max) - new Date(availableDates.min)) / (1000*60*60*24));
                          const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                          const dayIndex = Math.round(pct * totalDays);
                          const d = new Date(availableDates.min);
                          d.setDate(d.getDate() + dayIndex);
                          const currentDate = d.toISOString().split('T')[0];
                          setDragPeriod(prev => ({ ...prev, currentDate }));
                        }
                      }}
                      onMouseUp={() => {
                        if (dragPeriod.dragging && dragPeriod.startDate && dragPeriod.currentDate) {
                          const dates = [dragPeriod.startDate, dragPeriod.currentDate].sort();
                          setPeriod2({ start: dates[0], end: dates[1] });
                          const daysDiff = Math.round((new Date(dates[1]) - new Date(dates[0])) / (1000*60*60*24));
                          const p1End = new Date(dates[0]);
                          p1End.setDate(p1End.getDate() - 1);
                          const p1Start = new Date(p1End);
                          p1Start.setDate(p1Start.getDate() - daysDiff);
                          setPeriod1({ start: p1Start.toISOString().split('T')[0], end: p1End.toISOString().split('T')[0] });
                          setCompareType('previous');
                        }
                        setDragPeriod({ dragging: false, startX: 0, startDate: '', currentDate: '' });
                      }}
                      onMouseLeave={() => {
                        if (dragPeriod.dragging) {
                          setDragPeriod({ dragging: false, startX: 0, startDate: '', currentDate: '' });
                        }
                      }}
                    >
                      {/* Period B (comparison - gray) */}
                      {(() => {
                        const totalDays = Math.round((new Date(availableDates.max) - new Date(availableDates.min)) / (1000*60*60*24));
                        const p1StartDay = Math.round((new Date(period1.start) - new Date(availableDates.min)) / (1000*60*60*24));
                        const p1EndDay = Math.round((new Date(period1.end) - new Date(availableDates.min)) / (1000*60*60*24));
                        const p1StartPct = Math.max(0, (p1StartDay / totalDays) * 100);
                        const p1EndPct = Math.min(100, (p1EndDay / totalDays) * 100);
                        return (
                          <div 
                            className="absolute h-full bg-gray-500/60 rounded"
                            style={{ left: `${p1StartPct}%`, width: `${p1EndPct - p1StartPct}%` }}
                          />
                        );
                      })()}
                      
                      {/* Period A (current - blue) */}
                      {(() => {
                        const totalDays = Math.round((new Date(availableDates.max) - new Date(availableDates.min)) / (1000*60*60*24));
                        const p2StartDay = Math.round((new Date(period2.start) - new Date(availableDates.min)) / (1000*60*60*24));
                        const p2EndDay = Math.round((new Date(period2.end) - new Date(availableDates.min)) / (1000*60*60*24));
                        const p2StartPct = Math.max(0, (p2StartDay / totalDays) * 100);
                        const p2EndPct = Math.min(100, (p2EndDay / totalDays) * 100);
                        return (
                          <div 
                            className="absolute h-full bg-blue-500/70 rounded"
                            style={{ left: `${p2StartPct}%`, width: `${p2EndPct - p2StartPct}%` }}
                          />
                        );
                      })()}
                      
                      {/* Drag preview */}
                      {dragPeriod.dragging && dragPeriod.startDate && dragPeriod.currentDate && (() => {
                        const totalDays = Math.round((new Date(availableDates.max) - new Date(availableDates.min)) / (1000*60*60*24));
                        const dates = [dragPeriod.startDate, dragPeriod.currentDate].sort();
                        const startDay = Math.round((new Date(dates[0]) - new Date(availableDates.min)) / (1000*60*60*24));
                        const endDay = Math.round((new Date(dates[1]) - new Date(availableDates.min)) / (1000*60*60*24));
                        const startPct = (startDay / totalDays) * 100;
                        const endPct = (endDay / totalDays) * 100;
                        const dayCount = endDay - startDay + 1;
                        return (
                          <>
                            <div 
                              className="absolute h-full bg-blue-400/90 rounded ring-2 ring-blue-300"
                              style={{ left: `${startPct}%`, width: `${endPct - startPct}%` }}
                            />
                            <div 
                              className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-gray-900 px-2 py-1 rounded text-xs font-medium text-white whitespace-nowrap z-30"
                            >
                              {dates[0]} → {dates[1]} ({dayCount}d)
                            </div>
                          </>
                        );
                      })()}
                      
                      {/* Date labels */}
                      <div className="absolute bottom-1 left-2 text-[10px] text-gray-400">{availableDates.min}</div>
                      <div className="absolute bottom-1 right-2 text-[10px] text-gray-400">{availableDates.max}</div>
                    </div>

                    {/* Period summary */}
                    <div className="flex items-center justify-between mt-3 text-sm">
                      <div className="flex items-center gap-2">
                        <span className="w-3 h-3 rounded bg-gray-500"></span>
                        <span className="text-gray-400 font-medium">Comparison:</span>
                        <span className="text-gray-300">{period1.start} → {period1.end}</span>
                        <span className="text-gray-500 text-xs">
                          ({Math.round((new Date(period1.end) - new Date(period1.start)) / (1000*60*60*24)) + 1}d)
                        </span>
                      </div>
                      
                      <div className="flex items-center gap-2">
                        <span className="w-3 h-3 rounded bg-blue-500"></span>
                        <span className="text-blue-400 font-medium">Selected:</span>
                        <span className="text-gray-300">{period2.start} → {period2.end}</span>
                        <span className="text-gray-500 text-xs">
                          ({Math.round((new Date(period2.end) - new Date(period2.start)) / (1000*60*60*24)) + 1}d)
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              )}
              </div>

              {/* Card content: everything controlled by the header */}
              <div className="p-3 space-y-4">

            {/* Date Picker Modal */}
            {showDatePicker && (
              <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50" onClick={() => setShowDatePicker(false)}>
                <div className="bg-gray-800 rounded-lg shadow-2xl max-w-2xl w-full mx-4" onClick={e => e.stopPropagation()}>
                  <div className="p-4">
                    <div className="flex items-center justify-between mb-4">
