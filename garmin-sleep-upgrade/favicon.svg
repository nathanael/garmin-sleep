<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Garmin Sleep Love">
  <!-- The hero sleep-score ring at tab size: same track and green as the dashboard.
       r=21 gives a circumference of 131.95; the arc covers 75% of it. -->
  <rect width="64" height="64" rx="14" fill="#111827"/>
  <g transform="rotate(-90 32 32)" fill="none" stroke-width="9" stroke-linecap="round">
    <circle cx="32" cy="32" r="21" stroke="#374151"/>
    <circle cx="32" cy="32" r="21" stroke="#10b981" stroke-dasharray="98.96 32.99"/>
  </g>
</svg>
